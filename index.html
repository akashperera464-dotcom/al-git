<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="description" content="Dalu Plus — Tea Estate Supplier Management Platform. Offline-first PWA for estates, field supervisors and green-leaf suppliers. Powered by KDU Group." />
    <meta name="theme-color" content="#064e3b" />
    <script>
      // Every fresh launch starts in Light Mode before React paints. The user
      // can still switch to Dark Mode from the application header.
      document.documentElement.classList.remove("dark");
      document.documentElement.dataset.theme = "light";
      document.documentElement.style.colorScheme = "light";
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dalu Plus" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="192x192" href="/dalu-plus-pwa-192-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" /></noscript>
    <title>Dalu Plus · Tea Estate Supplier Management Platform</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: replaced the moment React mounts. Guarantees the page is
           never a blank screen while the bundle downloads, and shows recovery
           actions if a stale service worker blocks the new bundle. -->
      <div id="boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(60rem 30rem at 20% 0%,#0a5c45,#04231a 60%);color:#e6fff5;font-family:'Noto Sans',system-ui,sans-serif;padding:24px;text-align:center">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;overflow:hidden">
          <img src="/branding/dalu-plus-mark.png" alt="" style="width:44px;height:44px;object-fit:cover" onerror="this.style.display='none'" />
        </div>
        <div>
          <p style="margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em">Dalu Plus</p>
          <p style="margin:2px 0 0;font-size:11.5px;color:#9fe8cf">Powered by KDU Group</p>
          <p id="boot-status" style="margin:6px 0 0;font-size:12.5px;color:#9fe8cf">Loading your workspace…</p>
        </div>
        <div style="width:120px;height:3px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden">
          <div style="width:45%;height:100%;background:#34d399;border-radius:999px;animation:bootslide 1.1s ease-in-out infinite"></div>
        </div>
        <button id="boot-recover" type="button" style="display:none;margin-top:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:600 13px 'Noto Sans',system-ui,sans-serif;padding:10px 18px;border-radius:12px;cursor:pointer">Reload the latest version</button>
      </div>
      <style>@keyframes bootslide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}</style>
    </div>
    <script>
      (function () {
        var KEY = "kdu.boot.recovery"; // JSON ledger {count,last} of auto-recoveries
        var MAX_AUTO = 3, COOLDOWN = 30000;
        var splash = document.getElementById("boot-splash");
        var status = document.getElementById("boot-status");
        var button = document.getElementById("boot-recover");
        function ledger() {
          try {
            var v = JSON.parse(sessionStorage.getItem(KEY));
            if (v && typeof v.count === "number" && typeof v.last === "number") return v;
          } catch (e) {}
          return { count: 0, last: 0 };
        }
        function canAuto() {
          var l = ledger();
          return l.count < MAX_AUTO && Date.now() - l.last > COOLDOWN;
        }
        function showRecovery(message) {
          if (!splash) return;
          if (status) status.textContent = message;
          if (button) button.style.display = "inline-block";
        }
        function recover(auto) {
          // Auto-recovery is rate-limited: the first reload after a deploy is a
          // fully COLD load (worker unregistered, every cache wiped), and on
          // mobile data it can take 20-30s to re-download the bundle. A dead
          // "close other tabs" message while the page is still downloading is
          // exactly what looked like a stuck loader — so allow up to MAX_AUTO
          // gated attempts, keep the manual button always available.
          if (auto && !canAuto()) { showRecovery("Tap \"Reload the latest version\" below."); return; }
          if (auto) {
            var l = ledger();
            l.count += 1;
            l.last = Date.now();
            try { sessionStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {}
          }
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          }
          if (window.caches) tasks.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(tasks).catch(function () {}).then(function () { window.location.reload(); });
        }
        if (button) button.addEventListener("click", function () { recover(false); });
        // Exposed for the app bundle: a missing lazily-imported chunk triggers
        // the same recovery (see src/main.tsx).
        window.kduRecover = function (reason) {
          if (status && reason) status.textContent = "Recovering from an update (" + reason + ")";
          recover(false);
        };
        // A failed bundle load (stale SW / replaced asset) fires error on the script.
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && target.tagName === "SCRIPT") { showRecovery("Update detected — refreshing…"); recover(true); }
        }, true);
        // Vite emits this when a preloaded chunk 404s after a deploy.
        window.addEventListener("vite:preloadError", function () { recover(true); });
        // ONLY real failures wipe: script error / preload error. A slow load
        // must never be restarted — wiping mid-download restarts the whole
        // bundle fetch, which is exactly what made the loader look stuck.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.querySelector("#boot-splash")) { showRecovery("Still loading… slow connection. Keep waiting, or tap Reload."); }
        }, 20000);
        // Successful mount: clear the ledger so future deploys get fresh retries.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.querySelector("#boot-splash")) { try { sessionStorage.removeItem(KEY); } catch (e) {} }
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
